# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    runtime: static
    name: quickmedical-i
    repo: https://github.com/INCEPTIO-IMPERIUM/quickmedical_i
    branch: main
    # Redeploy on every push to main, but only after GitHub CI checks pass.
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "24"
    headers:
      # Vite fingerprints files in /assets, so they can be cached forever.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
    routes:
      # Serve index.html for any unknown path (single-page app).
      - type: rewrite
        source: /*
        destination: /index.html
